<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Thanks for signing — Take Tech Out</title>
  <link rel="stylesheet" href="styles.css">
  <style>
    .thanks-wrap {
      max-width: 640px;
      margin: 6rem auto;
      padding: 2rem 1.5rem;
      text-align: center;
    }
    .thanks-wrap h1 {
      font-size: 2.4rem;
      margin-bottom: 1.5rem;
      line-height: 1.15;
    }
    .thanks-wrap p {
      font-size: 1.1rem;
      line-height: 1.6;
      margin-bottom: 1.25rem;
    }
    .thanks-wrap .next-steps {
      margin-top: 2.5rem;
      padding-top: 1.5rem;
      border-top: 1px solid #ccc;
    }
    .thanks-wrap a.back {
      display: inline-block;
      margin-top: 2rem;
      color: inherit;
      text-decoration: underline;
    }
  </style>
</head>
<body>
  <main class="thanks-wrap">
    <h1>Thanks for signing.</h1>
    <p>You'll get a confirmation shortly.</p>
    <div class="next-steps">
      <p><strong>The next best thing you can do:</strong></p>
      <p>Write your School Board member, or forward this page to one Duluth parent, teacher, or neighbor who hasn't heard about it yet.</p>
    </div>
    <a class="back" href="/">← Back to the campaign</a>
  </main>
</body>
</html>
